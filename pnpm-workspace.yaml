allowBuilds:
  '@parcel/watcher': true
  '@patternslib/dev': true
  svelte-preprocess: true
  unrs-resolver: true
  yarn: false

minimumReleaseAgeExclude:
  - svelte@5.56.3
  - '@patternslib/dev@4.1.0'
  - '@patternslib/patternslib@9.11.0'

overrides:
  "slick-carousel": "-"
  "slides": "-"

shamefullyHoist: true
